<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Harness Plate Generator | VL Guitar Repair</title>
    <meta name="description" content="Professional guitar harness plate generator with photo upload and ruler calibration">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Guitar Harness Plate Generator</h1>
            <p class="subtitle">VL Guitar Repair | LoothTool.com</p>
        </header>

        <div class="workspace">
            <!-- Left Panel: Upload & Tools -->
            <div class="panel">
                <h2>Setup</h2>
                <label for="imageUpload" class="file-upload-label">
                    📸 Upload Photo<br>
                    <span style="font-size: 0.85rem; opacity: 0.7;">(with ruler for scale)</span>
                </label>
                <input type="file" id="imageUpload" accept="image/*">

                <div class="ruler-calibration" id="rulerSection" style="display: none;">
                    <p><strong>Ruler Calibration</strong></p>
                    <p>Click two points on the ruler, then enter the distance</p>
                    <div class="tool-group">
                        <label>Measurement Unit</label>
                        <select id="rulerUnit">
                            <option value="inch">Inches</option>
                            <option value="mm">Millimeters</option>
                        </select>
                    </div>
                    <div class="tool-group">
                        <label>Points marked: <span id="rulerPoints">0/2</span></label>
                    </div>
                    <div class="tool-group" id="rulerDistanceGroup" style="display: none;">
                        <label>Distance between points (<span id="unitLabel">inches</span>)</label>
                        <input type="number" id="rulerDistance" step="0.125" value="1.0" min="0.125" max="1000">
                        <button class="btn" id="setRulerScale" style="margin-top: 0.5rem;">Set Scale</button>
                    </div>
                    <button class="btn btn-secondary" id="resetRuler">Reset Ruler</button>
                </div>

                <h2 style="margin-top: 2rem;">Mode</h2>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="hole">Add Holes</button>
                    <button class="mode-btn" data-mode="trace">Trace</button>
                    <button class="mode-btn" data-mode="erase">Erase</button>
                </div>

                <div class="tool-group">
                    <label>Component Type</label>
                    <select id="componentType">
                        <option value="pot-cts-500k">CTS Pot 500K (3/8")</option>
                        <option value="pot-cts-250k">CTS Pot 250K (3/8")</option>
                        <option value="pot-pushpull">Push-Pull Pot (3/8")</option>
                        <option value="pot-mini">Mini Pot (1/4")</option>
                        <option value="toggle-3way">3-Way Toggle (3/8")</option>
                        <option value="toggle-mini">Mini Toggle (1/4")</option>
                        <option value="switch-5way">5-Way Switch (custom)</option>
                        <option value="jack-mono">Switchcraft Jack Mono (3/8")</option>
                        <option value="jack-stereo">Switchcraft Jack Stereo (3/8")</option>
                        <option value="jack-barrel">Barrel Jack (1/2")</option>
                        <option value="custom">Custom Hole</option>
                    </select>
                </div>

                <div class="tool-group" id="customDiameterGroup" style="display: none;">
                    <label>Hole Diameter (inches)</label>
                    <input type="number" id="customDiameter" step="0.01" value="0.375" min="0.1" max="2">
                </div>

                <div class="tool-group">
                    <label>Plate Thickness</label>
                    <input type="number" id="plateThickness" value="3" min="1" max="10" step="0.5">
                    <span style="font-size: 0.75rem; color: var(--text-dim);">mm</span>
                </div>
            </div>

            <!-- Center: Canvas -->
            <div class="canvas-container">
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
                    <button class="zoom-btn" id="zoomOut" title="Zoom Out">−</button>
                    <button class="zoom-btn" id="zoomFit" title="Fit to Screen">⊡</button>
                    <button class="zoom-btn" id="zoom100" title="100%">1:1</button>
                </div>
                <canvas id="canvas" width="800" height="600"></canvas>
                <div class="status" id="status">Ready. Upload an image to begin.</div>
            </div>

            <!-- Right Panel: Holes List & Export -->
            <div class="panel">
                <h2>Components (<span id="holeCount">0</span>)</h2>
                <ul class="hole-list" id="holeList"></ul>

                <div class="export-section">
                    <h2>Export</h2>
                    <button class="btn" id="exportSVG">Download SVG</button>
                    <button class="btn" id="exportSTL">Download STL (3D)</button>
                    <button class="btn" id="sendToSheet" style="background: #4ade80;">Send to Print Queue</button>
                    <button class="btn btn-secondary" id="clearAll">Clear All</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
